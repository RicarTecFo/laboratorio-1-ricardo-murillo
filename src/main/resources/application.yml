spring:
  application:
    name: lab-1

  datasource:
    url: jdbc:postgresql://localhost:5433/postgres-lab
    username: postgres-lab
    password: postgres-lab
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: update
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/supermercado

keycloak:
  token-uri: http://localhost:8180/realms/supermercado/protocol/openid-connect/token
  client-id: persistencia-api